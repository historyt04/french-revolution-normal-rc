name: Deploy v4.3 Supabase server candidate

on:
  push:
    branches:
      - v4.3-speed
    paths:
      - .github/workflows/deploy-v43-server.yml
      - supabase/**

permissions:
  contents: read

concurrency:
  group: v4.3-history-rc-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy history-rc-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          supabase functions deploy history-rc-api
          --project-ref mrrvuknoxkpowlqcwahk
          --no-verify-jwt
