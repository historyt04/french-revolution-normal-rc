<!doctype html><html lang="ko"><meta charset="utf-8"><title>RC 기기 저장소 검증</title><h1>RC 기기 저장소 검증</h1><p>실제 IndexedDB 검증입니다. 학생 API와 부하 시험은 실행하지 않습니다.</p><button id="run">저장소 검증 실행</button><pre id="result" role="status">대기</pre><script src="../normal-rc-outbox.js"></script><script>
document.querySelector('#run').onclick=async()=>{const started=performance.now(),name='history-normal-diagnostic-'+crypto.randomUUID(),output=document.querySelector('#result');const assert=(v,m)=>{if(!v)throw Error(m)};let db;try{const {IndexedCompletionStore,CompletionQueue}=HistoryNormalOutbox,store=new IndexedCompletionStore(name);db=await store.open();let effects=0,lose=true;const receipts=new Map();const request=async(action,payload,o)=>{if(receipts.has(o.requestId))return receipts.get(o.requestId);effects++;const r={attemptId:'diagnostic-attempt'};receipts.set(o.requestId,r);if(lose){lose=false;throw Error('response lost')}return r};const options={owner:()=> 'diagnostic-owner',request};let q=new CompletionQueue({...options,store});await q.enqueue({clientId:'diagnostic-completion',action:'attempt.quiz.complete',active:{attemptId:'diagnostic-attempt',revision:1},mode:'beginner',payload:{submissions:[]}});await q.flush();assert((await q.rows())[0].status==='pending','pending');db.close();const reopened=new IndexedCompletionStore(name);db=await reopened.open();q=new CompletionQueue({...options,store:reopened});await q.flush();assert(effects===1,'duplicate effect');assert((await q.rows())[0].status==='confirmed','confirmation');assert((await reopened.list('other-owner')).length===0,'owner partition');output.textContent=JSON.stringify({pass:true,tests:['IndexedDB commit','database reopen','lost-response replay','one server effect (mock)','owner partition'],durationMs:Math.round((performance.now()-started)*10)/10})}catch(e){output.textContent=JSON.stringify({pass:false,error:String(e.message)})}finally{db?.close();indexedDB.deleteDatabase(name)}};
</script></html>
